name: Bug Report
description: Report a bug in Hermeto
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections
        below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >
        Provide the steps needed to reproduce the issue. Include the
        hermeto command you ran, the project layout, and any relevant
        configuration.
      placeholder: |
        1. Run `hermeto fetch-deps ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: hermeto-version
    attributes:
      label: Hermeto version
      description: Output of `hermeto --version` or the container image tag.
      placeholder: "e.g. 0.5.0"
    validations:
      required: true

  - type: dropdown
    id: python-version
    attributes:
      label: Python version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - N/A (container image)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Fedora 41, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Paste any relevant log output or error messages.
        This will be automatically formatted as code.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >
        Any other context about the problem (e.g. lockfile snippets,
        package manager version, related issues).
