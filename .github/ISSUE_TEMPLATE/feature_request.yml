name: Feature Request
description: Suggest an enhancement or new feature for Hermeto
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in improving Hermeto! Please describe
        what you would like to see added or changed.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: >
        What problem does this feature solve? Is there something you
        cannot do today, or something that is harder than it should be?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        Describe the solution you would like. Include details about the
        expected behavior and, if applicable, the CLI interface or
        configuration changes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Have you considered any alternative solutions or workarounds?
        If so, please describe them.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >
        Any other context, references, or screenshots that help explain
        the request.
